name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que config.js existe
        run: |
          if [ ! -f config.js ]; then
            echo "config.js est absent : copie config.example.js en config.js, remplis-le et commite-le." >&2
            exit 1
          fi

      - name: Préparer le site (seulement les fichiers publics)
        run: |
          mkdir _site
          cp -r index.html config.js css js assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
