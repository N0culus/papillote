<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papillote — tes listes de souhaits, sans spoiler</title>
  <meta name="description" content="Crée ta liste de souhaits, partage-la, et laisse tes proches réserver en direct sans gâcher la surprise.">

  <!-- Les liens contiennent des secrets : jamais de Referer sortant, jamais d'indexation. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- CSP : scripts uniquement locaux + jsDelivr (supabase-js) ; connexions vers Supabase uniquement. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'">

  <meta name="theme-color" content="#1f4d3a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="skip-link" id="skip" type="button">Aller au contenu</button>
  <div id="deco" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Papillote a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
